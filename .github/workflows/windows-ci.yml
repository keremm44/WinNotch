name: Windows CI

on:
  push:
    branches:
      - main
      - feature/file-shelf-transfer
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WinNotch.sln

      - name: Build Release
        run: dotnet build WinNotch.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test tests/WinNotch.Tests/WinNotch.Tests.csproj -c Release --no-build --verbosity normal

      # Keep this workflow attached to the shelf-hardening branch so every
      # stabilization pass is validated on a real Windows runner before merge.
